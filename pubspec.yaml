name: vasture
description: "Vasture Your Sky."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  supabase_flutter: ^2.9.1
  camera: ^0.11.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  geolocator: ^13.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  dartz: ^0.10.1
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.1
  lucide_icons_flutter: ^3.1.9
  go_router_builder: ^3.0.0
  go_router: ^17.0.1
  gap: ^3.0.1
  smooth_page_indicator: ^2.0.1
  shimmer: ^3.0.0
  card_swiper: ^3.0.1
  dio: ^5.9.1
  retrofit: 4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  retrofit_generator: 9.7.0

flutter:
  uses-material-design: true

  assets:
  - .env
  - assets/fonts/
  - assets/icons/
  - assets/shapes/

  fonts:
  - family: InstrumentSerif
    fonts:
    - asset: assets/fonts/InstrumentSerif-Regular.ttf
    - asset: assets/fonts/InstrumentSerif-Italic.ttf
      style: italic
